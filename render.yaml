# Render.com deployment for the BrainVuln inference service.
# Builds the existing service/Dockerfile from this repo. The frozen 133 MB
# checkpoint is fetched at container STARTUP from a PRIVATE source
# (BRAINVULN_CHECKPOINT_URL [+ BRAINVULN_CHECKPOINT_TOKEN]) and SHA256-verified
# against 5930f0ff…a4a9 before anything is served; startup fails loudly on
# mismatch. Never commit real values for the sync:false secrets below.
# Set BRAINVULN_CORS_ORIGINS to the production frontend origin.
services:
  - type: web
    name: brainvuln-api
    runtime: docker
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    plan: standard      # needs >= 2 GB RAM for torch + the 133 MB checkpoint
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BRAINVULN_CORS_ORIGINS
        sync: false
        # expected production value: https://brain-vault-omega.vercel.app
      - key: BRAINVULN_CHECKPOINT_URL
        sync: false
      - key: BRAINVULN_CHECKPOINT_TOKEN
        sync: false
      - key: BRAINVULN_MAX_UPLOAD_MB
        value: 200
